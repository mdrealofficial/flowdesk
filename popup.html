<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowDesk</title>
    <link rel="stylesheet" href="lib/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <path
                d="M20 6.5 9.5 17 4 11.5"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <div class="brand-text">
            <h1>FlowDesk</h1>
            <span class="tagline">Task CRM</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="toggle-quick-add" class="icon-btn" type="button" title="Add new task" aria-label="Add new task" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button id="open-board" class="icon-btn" type="button" title="Open full board">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="7" height="7" rx="1.6" />
              <rect x="14" y="4" width="7" height="7" rx="1.6" />
              <rect x="3" y="14" width="7" height="7" rx="1.6" />
              <rect x="14" y="14" width="7" height="7" rx="1.6" />
            </svg>
          </button>
        </div>
      </header>

      <section class="stats" aria-label="Overview">
        <div class="stat">
          <span class="stat-value" id="stat-active">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-done">0</span>
          <span class="stat-label">Done today</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-streak">0</span>
          <span class="stat-label">Day streak</span>
        </div>
      </section>

      <form id="quick-add" class="quick-add is-collapsed" autocomplete="off">
        <input
          id="task-title"
          class="title-input"
          type="text"
          placeholder="What needs doing?"
          maxlength="160"
          required
          aria-label="Task title"
        />
        <div class="quick-row">
          <select id="task-priority" aria-label="Priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <input id="task-contact" type="text" placeholder="Contact" maxlength="120" aria-label="Contact or company" />
          <input id="task-due" type="date" aria-label="Due date" />
        </div>
        <div class="quick-row quick-row-2">
          <select id="task-repeat" aria-label="Repeat">
            <option value="none" selected>Does not repeat</option>
            <option value="daily">Repeats daily</option>
            <option value="weekly">Repeats weekly</option>
            <option value="monthly">Repeats monthly</option>
          </select>
          <button type="submit" class="btn-primary" id="add-btn">Add task</button>
        </div>
      </form>

      <nav class="filters" id="filters" aria-label="Filter tasks">
        <button class="chip is-active" type="button" data-filter="all">All</button>
        <button class="chip" type="button" data-filter="active">Active</button>
        <button class="chip" type="button" data-filter="done">Done</button>
      </nav>

      <main class="list-wrap">
        <ul id="task-list" class="task-list"></ul>
      </main>

      <footer class="popup-footer">
        <span id="footer-note">All clear</span>
        <button id="open-board-2" class="link-btn" type="button">Open board →</button>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
